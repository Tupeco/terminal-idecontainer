<!doctype html>
<!--
  The narrator's speaker. narrator.py serves this at /?token=...; `./dev
  narrator-url` on the host prints the address. Clips are announced over
  /events, fetched as WAV, played in order through Web Audio, and each one is
  reported back to /ended when it finishes. That report is what moves a tour
  on to its next stop, and what lets a plain `speak` call return. Each start
  is reported too, to /started, which moves the subtitle in Neovim.

  The output is never silent while listening. Speech arrived with its first
  word or two missing after every gap: Bluetooth headphones, and some sound
  cards and operating systems, power the output down after a moment of
  digital silence and take a few hundred milliseconds to bring it back, and
  Kokoro trims the silence from the ends of its clips, so the words start at
  the very first sample. A loop of noise far below hearing (about -74 dBFS)
  keeps the output awake between clips.

  The buttons go to /control; the server owns the tour (which stop is playing,
  stopped or not) and tells this page through "state" events, so two players
  open at once show the same thing. Pause is the exception: it only holds
  this page's audio, and the server simply waits for the clip to end. The
  page still reports it, so Claude can be told the listener is reading rather
  than guess something is stuck when a wait runs long. Pause stops the clip
  and remembers where, and Resume starts it again a little earlier, rather
  than suspending the AudioContext: a suspended context silences the output
  too, and the first words after Resume were lost the same way.

  Nothing connects until "Start listening" is pressed. Browsers refuse to play
  audio a page starts by itself, and a player that counted as listening while
  it could not make a sound would leave the tour waiting on silence.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narrator</title>
<style>
  :root {
    --bg: #f6f6f3; --fg: #1d1d1b; --muted: #6b6b66; --line: #dcdcd6;
    --accent: #3a63c8; --now: #e8eefc;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171b; --fg: #e6e6e3; --muted: #9a9a96; --line: #2c2e35;
      --accent: #7aa2f7; --now: #1f2740;
      color-scheme: dark;
    }
  }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 44rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  header { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
  h1 { font-size: 1.25rem; margin: 0; }
  #state { color: var(--muted); font-size: .9rem; }
  #state.bad { color: #c0392b; }
  #tour { margin: .75rem 0 0; color: var(--muted); min-height: 1.5em; }
  #tour b { color: var(--fg); font-weight: 600; }
  .controls { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1rem 0; }
  button {
    font: inherit; padding: .5rem 1rem; border-radius: .5rem;
    border: 1px solid var(--line); background: transparent; color: var(--fg);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  #now {
    min-height: 4.5rem; padding: 1rem; border-radius: .5rem;
    background: var(--now); font-size: 1.15rem;
  }
  #now:empty::before { content: "Waiting for something to say."; color: var(--muted); }
  ol { list-style: none; padding: 0; margin: 1.25rem 0 0; }
  li { padding: .5rem 0; border-top: 1px solid var(--line); color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Narrator</h1>
    <span id="state">not listening</span>
  </header>
  <div id="tour"></div>
  <div class="controls">
    <button id="start" class="primary">Start listening</button>
    <button id="prev" disabled title="Back to the previous stop">⏮ Previous</button>
    <button id="pause" disabled>Pause</button>
    <button id="next" disabled title="On to the next stop">Next ⏭</button>
    <button id="stop" disabled title="Hold the tour and hand back to Claude">Stop</button>
  </div>
  <div id="now"></div>
  <ol id="history"></ol>
</main>
<script>
"use strict";
const token = new URLSearchParams(location.search).get("token") || "";
const q = (p) => `${p}?token=${encodeURIComponent(token)}`;
const $ = (id) => document.getElementById(id);

let ctx = null;          // AudioContext, created inside the click that allows it
let queue = [];          // {id, text, ready: Promise<AudioBuffer>}, in arrival order
let current = null;      // {item, source, buffer, startedAt, offset}; source null while paused
let paused = false;
let resting = false;     // in the gap after a clip
const REWIND = 0.4;      // seconds replayed on Resume, to pick the sentence up again
let tour = null;         // the server's view: {title, state, index, total, complete, label}

function setState(text, bad) {
  $("state").textContent = text;
  $("state").className = bad ? "bad" : "";
}

function post(path, body) {
  return fetch(q(path), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  }).catch(() => {});
}

function remember(text) {
  const li = document.createElement("li");
  li.textContent = text;
  $("history").prepend(li);
  while ($("history").children.length > 50) $("history").lastChild.remove();
}

function showTour(t) {
  tour = t;
  const el = $("tour");
  el.textContent = "";
  if (!t) {
    $("stop").textContent = "Stop";
    return;
  }
  const n = Math.min(t.index + 1, t.total);
  const total = t.complete ? `${t.total}` : `${t.total}+`;
  const head = document.createElement("b");
  head.textContent = t.title;
  el.append(head);
  const what = {
    playing: t.index >= t.total ? " · waiting for Claude to write the next stop" : ` · stop ${n} of ${total}: ${t.label}`,
    stopped: ` · stopped at stop ${n} of ${total}: ${t.label}`,
    finished: ` · finished (${t.total} stops)`,
  }[t.state] || "";
  el.append(document.createTextNode(what));
  $("stop").textContent = t.state === "stopped" ? "Continue" : "Stop";
}

// Fetch and decode as soon as a clip is announced, but play strictly in order:
// the promise sits in the queue, so a later clip that decodes first still waits.
function enqueue(id, text, gap) {
  const ready = fetch(q(`clip/${id}.wav`))
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then((b) => ctx.decodeAudioData(b));
  queue.push({ id, text, gap, ready, cancelled: false });
  pump();
}

async function pump() {
  if (current || resting || paused || !queue.length) return;
  const item = queue.shift();
  current = { item, source: null, buffer: null, startedAt: 0, offset: 0 };
  $("now").textContent = item.text;
  let buffer;
  try {
    buffer = await item.ready;
  } catch (e) {
    // Report it anyway, or the server would wait for a clip that will never play.
    if (!item.cancelled) post("ended", { id: item.id });
    current = null;
    return pump();
  }
  if (item.cancelled) { current = null; return pump(); }
  current.buffer = buffer;
  // Paused while it was decoding: Resume starts it.
  if (!paused) play(0);
}

// Start (or restart, after Pause) the current clip `offset` seconds in.
function play(offset) {
  const { item, buffer } = current;
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.connect(ctx.destination);
  source.onended = () => {
    // Pause stops the source too, and has already set current.source aside.
    if (!current || current.source !== source) return;
    current = null;
    $("now").textContent = "";
    if (item.cancelled) return pump();
    post("ended", { id: item.id });
    remember(item.text);
    // A breath between clips, which Kokoro trims from both ends. The server
    // sizes it: longer after a long sentence, longer again before a new stop.
    resting = true;
    setTimeout(() => { resting = false; pump(); }, (item.gap ?? 0.35) * 1000);
  };
  current.source = source;
  current.startedAt = ctx.currentTime;
  current.offset = offset;
  source.start(0, offset);
  if (offset === 0) post("started", { id: item.id });
}

// Drop everything, the queue and whatever is playing, without reporting any
// of it as heard. The server sends this before a jump, a Stop or a new tour.
function flush() {
  for (const item of queue) item.cancelled = true;
  queue = [];
  if (current) {
    current.item.cancelled = true;
    // Its onended clears it; one held by Pause has no source to end.
    if (current.source) current.source.stop(); else current = null;
  }
  // Previous, Next and Stop all mean "go on from here", and a held Pause
  // would leave the new stop sitting silent.
  if (paused) togglePause();
}

// Inaudible noise, looped for as long as the page listens; see the top.
function keepAwake() {
  const buffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 2e-4;
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.loop = true;
  source.connect(ctx.destination);
  source.start();
}

function connect() {
  const es = new EventSource(q("events"));
  es.onopen = () => setState("listening");
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.type === "hello") setState(`listening · voice ${ev.voice}`);
    else if (ev.type === "clip") enqueue(ev.id, ev.text, ev.gap);
    else if (ev.type === "flush") flush();
    // Next outside a tour: end the current clip early, counted as heard.
    else if (ev.type === "skip") skip();
    else if (ev.type === "state") showTour(ev.tour);
  };
  es.onerror = () => {
    // EventSource retries on its own after a dropped connection. It gives up
    // only when the server answered with an error, which here means the token
    // no longer matches: the container was recreated and made a new one.
    if (es.readyState === EventSource.CLOSED) {
      setState("rejected: get a fresh link with ./dev narrator-url", true);
    } else {
      setState("reconnecting…", true);
    }
  };
}

function skip() {
  if (!current) return;
  if (current.source) { current.source.stop(); return; }
  // Held by Pause: nothing is playing to end, so report it heard directly.
  if (current.buffer) {
    post("ended", { id: current.item.id });
    current = null;
    $("now").textContent = "";
  }
}

function togglePause() {
  paused = !paused;
  if (paused) {
    if (current && current.source) {
      const at = current.offset + (ctx.currentTime - current.startedAt);
      const source = current.source;
      current.source = null;   // so its onended is not taken for the clip ending
      current.offset = Math.max(0, at - REWIND);
      source.stop();
    }
  } else if (current && current.buffer && !current.source) {
    play(current.offset);
  } else {
    pump();
  }
  $("pause").textContent = paused ? "Resume" : "Pause";
  post("control", { action: paused ? "pause" : "resume" });
}

$("start").onclick = () => {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  keepAwake();
  $("start").disabled = true;
  for (const b of ["prev", "pause", "next", "stop"]) $(b).disabled = false;
  connect();
};

$("pause").onclick = togglePause;
$("prev").onclick = () => post("control", { action: "prev" });
$("next").onclick = () => post("control", { action: "next" });

// Stop holds a tour where it is -- it stays held until Continue, whatever
// Claude is doing at that moment -- and the waiting Claude is told, so it can
// ask what you would like. Outside a tour it cuts a `speak` short.
$("stop").onclick = () => {
  const action = tour && tour.state === "stopped" ? "continue" : "stop";
  post("control", { action });
};

if (!token) setState("no token in the link: get one with ./dev narrator-url", true);
</script>
</body>
</html>
