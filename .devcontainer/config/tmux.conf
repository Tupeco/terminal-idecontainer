# tmux is the load-bearing piece of this setup: it is what makes a host suspend
# a non-event. The editor process keeps running here regardless of whether
# anything is attached.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Let OSC 52 through to the host terminal so yanks reach the macOS clipboard.
set -ga terminal-features ",*:clipboard"
set -g set-clipboard on

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# Neovim complains about the default; keeps Esc responsive in modal editors.
set -sg escape-time 10

# Never let tmux kill a session because a client vanished.
set -g destroy-unattached off
set -g detach-on-destroy off

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "reloaded"

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[bg=colour61,fg=colour255,bold] #S #[default] "
set -g status-right "#[fg=colour244]#{pane_current_path} #[fg=colour250]| %H:%M "
set -g status-left-length 30
set -g status-right-length 80
